# Docker Compose for Staging Environment
version: '3.8'

services:
  # PostgreSQL Database
  postgres-staging:
    image: postgres:14-alpine
    container_name: payroll-postgres-staging
    environment:
      POSTGRES_USER: payroll_user
      POSTGRES_PASSWORD: staging_password_change_me
      POSTGRES_DB: payroll_system_staging
    ports:
      - "5433:5432"
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_user -d payroll_system_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis-staging:
    image: redis:7-alpine
    container_name: payroll-redis-staging
    command: redis-server --requirepass staging_redis_password
    ports:
      - "6380:6379"
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-backend-staging
    environment:
      DATABASE_URL: "postgresql://payroll_user:staging_password_change_me@postgres-staging:5432/payroll_system_staging?schema=public"
      NODE_ENV: "production"
      PORT: 3001
      JWT_SECRET: "staging-jwt-secret-change-in-production"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      REDIS_HOST: "redis-staging"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "staging_redis_password"
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: "http://localhost:3000"
      LOG_LEVEL: "info"
    ports:
      - "3002:3001"
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-staging-data:
  redis-staging-data:
