<!DOCTYPE html>
<html>
<head>
    <title>Frontend Auth Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px; margin: 5px; }
        textarea { width: 100%; height: 100px; }
    </style>
</head>
<body>
    <h1>Frontend Auth Debug Tool</h1>
    
    <div class="section">
        <h2>1. Test Login API</h2>
        <button onclick="testLogin()">Test Login with admin@demosecurity.co.in</button>
        <div id="loginResult"></div>
    </div>

    <div class="section">
        <h2>2. Check LocalStorage</h2>
        <button onclick="checkStorage()">Check Auth Storage</button>
        <div id="storageResult"></div>
    </div>

    <div class="section">
        <h2>3. Test Profile API with Token</h2>
        <button onclick="testProfile()">Test Profile Endpoint</button>
        <div id="profileResult"></div>
    </div>

    <div class="section">
        <h2>4. Manual Token Test</h2>
        <input type="text" id="manualToken" placeholder="Paste JWT token here..." style="width: 400px;">
        <button onclick="testWithManualToken()">Test with Manual Token</button>
        <div id="manualResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3005/api/v1';
        
        async function testLogin() {
            const result = document.getElementById('loginResult');
            result.innerHTML = '<p>Testing login...</p>';
            
            try {
                console.log('Starting login test...');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@demosecurity.co.in',
                        password: 'admin123'
                    })
                });
                
                console.log('Login response status:', response.status);
                const data = await response.json();
                console.log('Login response data:', data);
                
                if (data.success && data.data) {
                    // Store token for later tests
                    const token = data.data.tokens.accessToken;
                    localStorage.setItem('debug-token', token);
                    
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ Login Successful</h3>
                            <p>User: ${data.data.user.email}</p>
                            <p>Role: ${data.data.user.role}</p>
                            <p>Token stored for further tests</p>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="error">❌ Login failed: ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                console.error('Login test error:', error);
                result.innerHTML = `<div class="error">❌ Login error: ${error.message}</div>`;
            }
        }
        
        function checkStorage() {
            const result = document.getElementById('storageResult');
            
            try {
                const authStorage = localStorage.getItem('auth-storage');
                const debugToken = localStorage.getItem('debug-token');
                
                result.innerHTML = `
                    <div>
                        <h3>LocalStorage Contents:</h3>
                        <h4>auth-storage:</h4>
                        <textarea readonly>${authStorage || 'Not found'}</textarea>
                        <h4>debug-token:</h4>
                        <textarea readonly>${debugToken || 'Not found'}</textarea>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Storage check error: ${error.message}</div>`;
            }
        }
        
        async function testProfile() {
            const result = document.getElementById('profileResult');
            result.innerHTML = '<p>Testing profile API...</p>';
            
            try {
                const token = localStorage.getItem('debug-token');
                if (!token) {
                    result.innerHTML = '<div class="error">❌ No token found. Run login test first.</div>';
                    return;
                }
                
                console.log('Testing profile with token:', token.substring(0, 50) + '...');
                
                const response = await fetch(`${API_BASE}/auth/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Profile response status:', response.status);
                const data = await response.json();
                console.log('Profile response data:', data);
                
                if (response.ok && data.success) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ Profile API Success</h3>
                            <p>User: ${data.data.email}</p>
                            <p>Role: ${data.data.role}</p>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">
                            <h3>❌ Profile API Failed</h3>
                            <p>Status: ${response.status}</p>
                            <p>Response: ${JSON.stringify(data)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Profile test error:', error);
                result.innerHTML = `<div class="error">❌ Profile error: ${error.message}</div>`;
            }
        }
        
        async function testWithManualToken() {
            const result = document.getElementById('manualResult');
            const token = document.getElementById('manualToken').value.trim();
            
            if (!token) {
                result.innerHTML = '<div class="error">❌ Please enter a token</div>';
                return;
            }
            
            result.innerHTML = '<p>Testing with manual token...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/auth/profile`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ Manual Token Test Success</h3>
                            <p>User: ${data.data.email}</p>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">
                            <h3>❌ Manual Token Test Failed</h3>
                            <p>Status: ${response.status}</p>
                            <p>Response: ${JSON.stringify(data)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Manual test error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
